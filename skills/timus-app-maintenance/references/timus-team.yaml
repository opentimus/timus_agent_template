# 语义包：表头元数据 + 本地记录。换应用时改 apps 下的应用名（即 app_name）/ tables / fields；tbl... 仅追溯。
# 层级：apps → 应用名(app_name) → tables + fields + records；字段写作 类型@策略，省略策略取 type_policy 默认；records 下为 表 → 记录 ID → 字段: 值，User 字段值为 open_id。

schema_version: "1.0.0"
