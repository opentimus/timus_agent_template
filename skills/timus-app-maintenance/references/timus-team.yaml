# 语义包：表头元数据 + 本地记录。换应用时改 apps 下应用名 / language / tables / fields；tbl... 仅追溯。
# 层级：apps → 应用名(app_name) → language + tables + fields + records；tables / fields / records 用稳定 ID，tables.<表>.platform[language] 与 fields.<表>.<字段>.platform[language] 用于请求。

schema_version: "1.0.0"
connector: timus-runtime

type_policy:
  AutoNumber: read_only
  CreatedTime: read_only
  Lookup: read_only
  User: writable
  Formula: read_only
  Text: writable
  Number: writable
  SingleSelect: writable
  DateTime: writable

apps:
  TODO_APP_A:
    language: en
    tables:
      member:
        id: tblDemoMember00001
        platform: {zh: 团队成员, en: member}
      task:
        id: tblDemoTask000002
        platform: {zh: 成员任务, en: task}
    fields:
      member:
        sys.member_id:
          type: AutoNumber@read_only
          platform: {zh: S.成员ID, en: sys.member_id}
        sys.member_name:
          type: Text@writable
          platform: {zh: S.成员, en: sys.member_name}
        sys.role:
          type: SingleSelect@writable
          platform: {zh: S.角色, en: sys.role}
        sys.user:
          type: User@writable
          platform: {zh: S.用户, en: sys.user}
        sys.created_at:
          type: CreatedTime@read_only
          platform: {zh: S.创建时间, en: sys.created_at}
      task:
        sys.task_id:
          type: AutoNumber@read_only
          platform: {zh: S.任务ID, en: sys.task_id}
        sys.task_name:
          type: Text@writable
          platform: {zh: S.任务名, en: sys.task_name}
        sys.assignee:
          type: User@writable
          platform: {zh: S.负责人, en: sys.assignee}
        sys.points:
