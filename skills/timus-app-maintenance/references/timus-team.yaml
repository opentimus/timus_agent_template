# 语义包：表头元数据 + 本地记录。换应用时改 apps 下的应用名（即 app_name）/ tables / fields；tbl... 仅追溯。
# 层级：apps → 应用名(app_name) → tables + fields + records；字段写作 类型@策略，省略策略取 type_policy 默认；members 为成员快照，open_id 是 User 写入值。

schema_version: "1.0.0"
connector: timus-runtime
synced_at: "2026-11-26 15:44:53"

type_policy:
  AutoNumber: read_only
  CreatedTime: read_only
  Lookup: read_only
  User: writable
  Formula: read_only
  Text: writable
  Number: writable
  SingleSelect: writable
  DateTime: writable

