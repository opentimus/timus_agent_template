# <应用名> 基础数据（Carly 通用模板）
#
# 两类 schema 之二：本文件存本地业务块（记录值）；timus-team-schema.yaml 存表头元数据（表名 / 字段名 / 类型 / 可写性）。
# 基础数据用于本地查询命中，避免远程调用；表名与字段名必须逐字照抄表头元数据，禁止自定义字段。
#
# 格式是受限 YAML 子集：顶层键、2 空格表名、4 空格记录 ID、6 空格字段名: 值；不支持列表、锚点与跨行结构。
# `query_data.py` 把行内第一个 `#` 视为注释起点，值中不能出现井号字面量；模板正文只能以 `#` 注释形式存在。
#
# 校验清单：
# - `team_code` 与表头元数据一致。
# - 表名必须与表头元数据 `tables` 一致；记录 ID 仅本地追溯，不写入连接器参数。
# - 字段名须在表头元数据该表的 `fields` 中；值按类型书写（DateTime 用完整 YYYY-MM-DD HH:mm:ss，Number 可带引号）。
#
# schema_version: "1.0.0"
# team_code: <APP_CODE>
# data:
#   表A:
#     record001:
#       S.主键ID: "1"
#       S.名称: 示例名称
#       S.状态: 活跃
#   表B:
#     record002:
#       S.单号: "SO-0001"
#       S.外键ID: "1"
#       S.数量: "6.00"
